# GannaApp — nginx reverse proxy
# Install:  sudo cp deploy/nginx-gannaapp.conf /etc/nginx/sites-available/gannaapp
#           sudo ln -s /etc/nginx/sites-available/gannaapp /etc/nginx/sites-enabled/
#           sudo rm -f /etc/nginx/sites-enabled/default && sudo nginx -t && sudo systemctl reload nginx
#
# After pointing a domain here, run `sudo certbot --nginx -d your-domain.com`
# and certbot will rewrite this file to add the HTTPS server block.

server {
    listen 80;
    listen [::]:80;

    # Replace with your domain once DNS points at this instance's static IP.
    server_name _;

    # CSV / Excel uploads go through the API as JSON; the backend caps at 10mb.
    client_max_body_size 12m;

    # Compress text responses that Node did not already compress
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    location / {
        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        # A full-season replay can take a while — do not cut it off at 60s.
        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }
}
